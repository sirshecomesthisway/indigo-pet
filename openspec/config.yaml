schema: spec-driven

context: |
  ## Project: Squid Pet
  An always-on-top, transparent, pixel-art desktop pet (a pink chibi octopus named Squid)
  that visually reflects the state of the AI coding agent(s) running on the user's Mac
  (Claude Code and/or Codex).

  ## Owner
  Huiping "Pink" Tan — Senior Product Manager at internal (user pink)

  ## Why
  Pink runs long-lived agentic CLI sessions and wanted an ambient companion
  that gives an at-a-glance read of what the agent is doing without forcing her to
  flip to the terminal. The pet replaces a previous Cocoa-Pop-Cat-style indicator.

  Pink-2026-08-27: the project started life watching TPA (a separate,
  internal CLI coding agent) specifically. All TPA-specific
  code was fully removed 2026-08-27 -- TPA was never actually
  installed/run in this environment, so it never fired anything in
  practice. Squid now watches Claude Code and Codex as its primary
  detectors; the sections below describe the current architecture, not
  the original TPA-only one.

  ## Tech stack
  - Language: Python 3.13
  - Package manager: uv (with `.venv`)
  - Window: pywebview with WKWebView (macOS)
  - Native OS access: PyObjC (AppKit, Foundation) — included with pywebview
  - Process inspection: psutil
  - Image processing: Pillow (for alpha-mask hit-testing)
  - Frontend: vanilla HTML + CSS keyframe animations (no framework, no bundler)
  - Sprites: 7 hand-generated PNG sprites (one per state), transparent background,
    pixel-art / chibi style, ~180x180 displayed

  ## Architecture (high level)
  - watcher.py    — pure-Python state machine that polls process/CPU/log signals
                    and writes ~/.squid-pet/state.json every 1s.
  - window.py     — pywebview window + JS↔Python bridge (PetApi class).
                    Owns the NSWindow directly via PyObjC for accurate positioning,
                    dragging, and click-passthrough.
  - passthrough.py— background thread that performs pixel-perfect alpha hit-testing
                    so transparent regions of the window do not block clicks behind.
  - frontend/index.html — full UI: <img> sprite that swaps based on state, CSS
                    keyframe animation per state, JS event handlers for drag /
                    right-click / dbl-click.
  - frontend/sprites/   — 7 PNGs: idle, thinking, working, grooving, celebrating,
                    sleeping, concerned.

  ## State model (current)
  Priority order — first match wins each tick (see watcher.py:StateMachine.compute):
    1. sleeping     — macOS idle > 5 min
    2. celebrating  — held ~20 sec after Claude Code's/Codex's busy signal
                       drops to idle, or Git sees a fresh commit
    3. grooving     — extensibility hook; no detector currently implements this
    4. working      — live shell child, or a project file was just written
                       (Claude Code or Codex)
    5. thinking      — Claude Code/Codex wrote a session transcript recently,
                       no shell/file evidence
    6. (non-agent detector busy — generic OR fallback: git/terminal/ide)
    fallback        — idle/watching
  approval_needed (the flag-wave) can override any of the above -- driven
  entirely by Claude Code's own Notification hook, see
  openspec/specs/state-detection/spec.md and
  openspec/specs/user-interactions/spec.md.
  concerned has no detector implementation (was TPA-only, no
  Claude Code/Codex equivalent exists) -- documented non-goal.

  ## Constraints & conventions
  - macOS only (uses PyObjC, NSWindow, NSEvent, NSScreen)
  - No admin / accessibility permissions required (uses native NSWindow APIs only)
  - Single-user, single-window app — assumes Pink's Mac
  - Sprites must have a transparent background (alpha=0 on bg) — flood-filled from corners
  - All Python files use absolute imports within the squid_pet package
  - Frontend HTML is loaded as file:// URL; no HTTP server

