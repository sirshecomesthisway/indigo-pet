[project]
name = "squid-pet"
version = "0.2.1"
description = "A desktop companion pet that watches TPA + VS Code and reacts to activity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "psutil>=6.0",
    "pillow",
]

[project.scripts]
squid-pet = "squid_pet.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squid_pet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
